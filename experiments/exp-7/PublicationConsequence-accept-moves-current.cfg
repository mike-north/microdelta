\* Consequence-only run of Fault = "accept-moves-current": AcceptanceKeepsCurrentAndHistory,
\* which restates the guard, is omitted, so TLC reports whether any retained-history invariant breaks.
CONSTANTS
  Contenders = {A, B}
  AttemptKeys = {"seed", "abandoned", "successor"}
  MaxGeneration = 3
  MaxFence = 2
  MaxTime = 2
  LeaseLength = 1
  Fault = "accept-moves-current"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  CurrentIsComplete
  CompletedHistoryIsRetained
  AcknowledgedHistoryIsReadable
  PublicationUsedCurrentAuthority
  RejectedStaleMutationPreservesDurableState
  DurableHighWaterNeverRegresses
  CompletedRetryKeepsReferenceAndSkipsBody
  ExactReferenceReadIsStable
  EndedAttemptIsNeverAResult

CHECK_DEADLOCK FALSE
