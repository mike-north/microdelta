\* Known-bad control: Fault = "acquire-ignores-expiry" weakens exactly one production guard.
CONSTANTS
  Processes = {P1, P2}
  HolderNames = {"w", "v"}
  MaxFence = 3
  MaxTime = 3
  LeaseLength = 2
  Fault = "acquire-ignores-expiry"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  AcceptedFromLatestGrant
  StorageSeesNonDecreasingFences
  AtMostOneAuthority
  FenceNeverRegresses
  RejectedPreservesAuthorityState
  AcceptedWithinLease
  EndedAuthorityNeverActs
  EffectiveTimeNeverRegresses
  GrantIssuesFreshFence
  TakeoverOnlyAfterExpiry
  WaiterPreservesAuthorityState
  BusyNamesUnexpiredHolder
  InspectionChangesNothing

CHECK_DEADLOCK FALSE
