\* Known-bad control: Fault = "waiter-advances-fence" weakens exactly one production guard.
CONSTANTS
  Processes = {P1, P2}
  HolderNames = {"w", "v"}
  MaxFence = 3
  MaxTime = 3
  LeaseLength = 2
  Fault = "waiter-advances-fence"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  AcceptedByCurrentAuthority
  EndedAuthorityNeverActs
  StorageSeesNonDecreasingFences
  AtMostOneAuthority
  FenceNeverRegresses
  RejectedPreservesAuthorityState
  EffectiveTimeNeverRegresses
  GrantIssuesFreshFence
  TakeoverOnlyAfterExpiry
  WaiterPreservesAuthorityState
  InspectionChangesNothing

CHECK_DEADLOCK FALSE
