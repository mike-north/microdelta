\* Storage-only run of Fault = "takeover-before-expiry": the lease-promise and protocol invariants
\* are omitted, so TLC reports whether the weakened guard reaches a storage-safety violation.
CONSTANTS
  Processes = {P1, P2}
  HolderNames = {"w", "v"}
  MaxFence = 3
  MaxTime = 3
  LeaseLength = 2
  Fault = "takeover-before-expiry"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  AcceptedFromLatestGrant
  StorageSeesNonDecreasingFences
  AtMostOneAuthority
  FenceNeverRegresses
  RejectedPreservesAuthorityState

CHECK_DEADLOCK FALSE
