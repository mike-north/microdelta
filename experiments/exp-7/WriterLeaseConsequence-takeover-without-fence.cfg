\* Consequence-only run of Fault = "takeover-without-fence": protocol statements omitted, so TLC
\* reports whether the weakened guard reaches a storage-safety violation.
CONSTANTS
  Processes = {P1, P2}
  HolderNames = {"w", "v"}
  MaxFence = 3
  MaxTime = 3
  LeaseLength = 2
  Fault = "takeover-without-fence"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  AcceptedByCurrentAuthority
  EndedAuthorityNeverActs
  StorageSeesNonDecreasingFences
  AtMostOneAuthority
  FenceNeverRegresses
  RejectedPreservesAuthorityState

CHECK_DEADLOCK FALSE
