\* The production protocol with three processes: every guard present, every invariant checked.
CONSTANTS
  Processes = {P1, P2, P3}
  HolderNames = {"w", "v"}
  MaxFence = 3
  MaxTime = 3
  LeaseLength = 2
  Fault = "none"

SPECIFICATION Spec

INVARIANTS
  TypeOK
  AcceptedByCurrentAuthority
  EndedAuthorityNeverActs
  StorageSeesNonDecreasingFences
  AtMostOneAuthority
  FenceNeverRegresses
  RejectedPreservesAuthorityState
  EffectiveTimeNeverRegresses
  GrantIssuesFreshFence
  TakeoverOnlyAfterExpiry
  WaiterPreservesAuthorityState
  InspectionChangesNothing

CHECK_DEADLOCK FALSE
